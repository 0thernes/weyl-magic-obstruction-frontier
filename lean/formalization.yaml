project:
  name: "The 2-Adic Magic Obstruction, Quaternary Bent-Hyperplane Rupture, Super-MUB Torsion Anomalies, and Divided-Power Characteristic-3 Alltop Constructions Across Product Weyl-Heisenberg Groups"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization (38 audited declarations strictly within
    [propext, Classical.choice, Quot.sound], zero sorry outside statement-only
    PalomarChallenge.lean, zero native_decide, verified across all 6 independent proof
    kernels) establishing five linked pillars on extremal Stabilizer Renyi Entropy
    M_alpha across product Weyl-Heisenberg groups: (I) unconditional universal 2-adic
    odd-qubit WH-MUB obstruction for all odd n >= 3 (T1a-T1d, sharp at n = 1, 2);
    (II) universal symplectic Lagrangian rigidity, Fermat Gaussian-square phase locking,
    Rothaus's (1976) bent-function degree bound for all m >= 2, exhaustive F_2^4
    bent classification (896 bent quadratics), and complete n = 4 Z_4 bent-hyperplane
    rupture closed end-to-end inside Lean for arbitrary IsBent 2 f (T2a-T2e +
    n4_z4_bent_hyperplane_rupture_arbitrary_bent); (III) exact Z[zeta_8] WH-MUB
    fiducials and exact Z[i] Super-MUB witnesses in W(4) x W(2) and W(4) x W(4)
    strictly beating WH-MUB at alpha = 2, 3 while crossing above WH-MUB at alpha = 4,
    plus the four-tier order-16 phase hierarchy (T3a-T3e); (IV) universal three-stratum
    two-stabilizer Parseval tower unifying n = 1, 2, 3, exact n = 4 stationary cubic,
    exact n = 5 SOS floor >= 3 ruptured by a Z[i]^32 witness (Phi_4 ~= 2.666086), and
    universal k-uniform/AME Cauchy-Schwarz magic ceilings (T4a-T4d); and (V) elementary
    ring-free Z_9 carry-quadratic divided-power char-3 Alltop MUBs for W(3)^tensor-{1,2,3}
    (extended to D = 81 in Rust/C11), Z[zeta_5] certificates for W(5)^tensor-{1,2}, and
    exact Fubini-Study Quantum Geometric Tensor metric g_{theta,theta} (T5a-T5d).
