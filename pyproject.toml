# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weyl-magic-obstruction-frontier"
version = "1.1.2"
description = "Formal proofs and polyglot exact verifiers for Weyl-Heisenberg magic obstructions, bent-hyperplane rupture, Super-MUB anomalies, and divided-power char-3 Alltop constructions"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
  {name = "Alexander Stephen Donahue", email = "0_0@0thernes.art"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.80", "ruff>=0.4", "mypy>=1.8", "matplotlib>=3.7", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
